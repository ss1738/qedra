name: CI
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install uv==0.11.14
      - run: uv sync --frozen --extra mcp --extra dev --python "$(command -v python3)"
      - name: all tests (including MCP and attestation)
        run: uv run --no-sync python3 -m pytest -q
      - name: package lint
        run: uv run --no-sync python3 -m ruff check qedra
      - name: cli smoke (packaging + console scripts)
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          qedra-verify --help
          qedra-policy init --protected main,release
          qedra-policy init --preset devops --out /tmp/ci-devops-spec.json
          qedra-serve --help
          qedra-hook --print-config
          echo '{"tool_name":"Bash","tool_input":{"command":"git push origin main --force"}}' \
            | qedra-hook | grep -q '"permissionDecision": "deny"'
